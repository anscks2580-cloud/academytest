<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<style>[hidden]{display:none!important} body{margin:0} img{max-width:100%}</style>
</head>
<body>
<title>새봄수학학원 시안 B</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 흰 바탕 + 모눈종이 무늬 첫 화면, 가운데 정렬 큰 제목, 둥근 카드 타일 · 남색 글씨에 주황 포인트 */
:root {
  --paper: #ffffff;
  --card: #ffffff;
  --ink: #1a2547;
  --muted: #5c6683;
  --line: #e1e6f0;
  --night: #1a2547;
  --accent: #ff6a3d;
  --accent-ink: #ffffff;
  --gold: #e0501f;
  --tint: #fff1eb;
  --ok: #1f8a5a;
  --warn: #c8402a;
  --soft: #f5f7fc;
  --grid: #e3eaf7;
  --display: 'Gothic A1', 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
  --body: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.6; word-break: keep-all; overflow-wrap: anywhere; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1100px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { text-wrap: balance; }

/* ── 머리 ── */
.site-head { background: rgba(255,255,255,.96); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: #fff; }
.bar { display: flex; align-items: center; gap: 28px; padding-block: 14px; }
.logo { display: flex; align-items: center; gap: 10px; background: none; border: 0; cursor: pointer; padding: 0; }
.logo-mark { width: 36px; height: 36px; border-radius: 12px; background: var(--night); display: grid; place-items: center; font-family: var(--display); font-weight: 800; color: #fff; font-size: 17px; position: relative; }
.logo-mark::after { content: ''; position: absolute; right: -3px; top: -3px; width: 11px; height: 11px; border-radius: 50%; background: var(--accent); border: 2px solid #fff; }
.logo-text { font-family: var(--display); font-weight: 800; font-size: 20px; letter-spacing: -0.5px; }
.nav { display: flex; gap: 6px; margin-left: 12px; }
.nav button { background: none; border: 0; padding: 8px 14px; font-weight: 700; font-size: 15px; cursor: pointer; border-radius: 999px; color: var(--muted); }
.nav button:hover { color: var(--ink); background: var(--soft); }
.nav button.on { color: var(--ink); background: var(--soft); }
.uact { margin-left: auto; display: flex; gap: 8px; align-items: center; font-size: 14px; }
.uact .who { color: var(--muted); }
.pill { border-radius: 999px !important; }
.burger { display: none; background: none; border: 0; width: 40px; height: 40px; cursor: pointer; }
.burger span { display: block; height: 2px; background: var(--ink); margin: 6px 7px; border-radius: 2px; }
.mnav { display: none; }
@media (max-width: 860px) {
  .nav { display: none; }
  .uact .who { display: none; }
  .burger { display: block; }
  .mnav.open { display: grid; gap: 6px; padding-bottom: 14px; }
  .mnav button { text-align: left; background: var(--soft); border: 0; border-radius: 12px; padding: 12px 14px; font-weight: 700; cursor: pointer; }
}
/* ── 첫 화면 ── */
.graph { background-color: #fff; background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 26px 26px; background-position: center top; }
.bhero { text-align: center; padding-block: 84px 40px; position: relative; }
.bhero .tag { display: inline-flex; align-items: center; gap: 8px; background: #fff; border: 1.5px solid var(--ink); border-radius: 999px; padding: 6px 16px; font-weight: 700; font-size: 14px; }
.bhero .tag i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.bhero h1 { font-family: var(--display); font-weight: 800; font-size: clamp(36px, 6.4vw, 72px); line-height: 1.12; letter-spacing: -2px; margin: 24px auto 0; max-width: 14em; }
.bhero h1 em { font-style: normal; display: block; color: var(--accent); }
.bhero h1 em span { position: relative; }
.bhero h1 em span::after { content: ''; position: absolute; left: -2%; right: -2%; bottom: .02em; height: .14em; background: var(--ink); border-radius: 4px; transform: rotate(-1deg); opacity: .9; }
.bhero p { color: var(--muted); font-size: 17px; margin: 26px auto 0; max-width: 32em; }
.bhero .cta { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-top: 30px; }
.bhero .cta .btn { padding: 14px 26px; font-size: 16px; }
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 56px; text-align: left; }
.tile { background: #fff; border: 1.5px solid var(--line); border-radius: 18px; padding: 22px 22px 20px; cursor: pointer; display: grid; gap: 6px; text-align: left; justify-items: start; align-content: start; transition: transform .15s, border-color .15s, box-shadow .15s; min-width: 0; }
.tile:hover { transform: translateY(-3px); border-color: var(--ink); box-shadow: 0 10px 24px rgba(26,37,71,.08); }
.tile svg { width: 34px; height: 34px; stroke: var(--accent); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; margin-bottom: 6px; }
.tile b { font-family: var(--display); font-size: 18px; font-weight: 800; }
.tile small { color: var(--muted); font-size: 13px; line-height: 1.5; }
.bsec { padding-block: 56px; }
.bsec h2 { font-family: var(--display); font-weight: 800; font-size: 26px; letter-spacing: -0.5px; margin: 0 0 18px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.bsec h2 button { background: none; border: 0; font-size: 14px; color: var(--gold); font-weight: 700; cursor: pointer; }
.btwo { display: grid; grid-template-columns: 1.4fr 1fr; gap: 18px; }
.bbox { background: #fff; border: 1.5px solid var(--line); border-radius: 18px; padding: 24px; min-width: 0; }
.bbox h3 { font-family: var(--display); font-weight: 800; font-size: 19px; margin: 0 0 12px; display: flex; justify-content: space-between; }
.bbox h3 button { background: none; border: 0; color: var(--gold); font-weight: 700; cursor: pointer; font-size: 13px; }
.bnav { background: var(--night); color: #fff; border-color: var(--night); }
.bnav .tel { font-family: var(--display); font-weight: 800; font-size: 26px; line-height: 1.45; font-variant-numeric: tabular-nums; }
.bnav .tel small { font-family: var(--body); font-size: 13px; font-weight: 500; color: #aab3cf; margin-right: 8px; }
.bnav .hours { color: #c4cbe0; font-size: 14px; margin-top: 8px; }
.nlist { display: grid; }
.nlist button { display: flex; justify-content: space-between; gap: 14px; background: none; border: 0; border-bottom: 1px dashed var(--line); text-align: left; cursor: pointer; padding: 12px 0; }
.nlist button:last-child { border-bottom: 0; }
.nlist button span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; font-weight: 500; }
.nlist button:hover span:first-child { color: var(--gold); }
.nlist time { flex-shrink: 0; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.bsteps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; counter-reset: st; list-style: none; padding: 0; margin: 0; }
.bsteps li { counter-increment: st; background: var(--soft); border-radius: 18px; padding: 22px; }
.bsteps li::before { content: counter(st); display: block; font-family: var(--display); font-weight: 800; font-size: 40px; color: var(--accent); line-height: 1; margin-bottom: 10px; }
.bsteps b { display: block; font-size: 16px; }
.bsteps span { color: var(--muted); font-size: 14px; }
@media (max-width: 860px) {
  .tiles { grid-template-columns: 1fr 1fr; }
  .btwo, .bsteps { grid-template-columns: 1fr; }
  .bhero { padding-top: 56px; }
}
/* ── 공통 페이지 ── */
.band { background: var(--night); color: #fff; }
.band .wrap { padding-block: 46px 40px; }
.band small { color: var(--accent); font-weight: 700; letter-spacing: 2px; font-size: 12px; }
.band h1 { font-family: var(--display); font-weight: 400; font-size: 34px; margin: 6px 0 0; }
.page { padding-block: 40px 80px; }
.section { margin-top: 56px; }
.section h2 { font-family: var(--display); font-weight: 600; font-size: 26px; margin: 0 0 18px; }
.panel { background: var(--card); border: 1px solid var(--line); padding: 24px; }
.muted { color: var(--muted); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--ink); background: var(--night); color: #fff; padding: 10px 18px; font-weight: 700; cursor: pointer; font-size: 14px; }
.btn:hover { background: #000; }
.btn.line { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.line:hover { border-color: var(--ink); }
.btn.yellow { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { background: transparent; color: var(--warn); border-color: #e8c9bd; }
.btn.danger:hover { border-color: var(--warn); }
.btn.sm { padding: 6px 12px; font-size: 13px; }
.btn:disabled { opacity: .45; cursor: default; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--card); padding: 7px 16px; cursor: pointer; font-weight: 500; }
.chip.on { background: var(--night); color: #fff; border-color: var(--night); }
.lbl { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: 1px; margin: 18px 0 8px; }
.field { display: grid; gap: 6px; }
.field label { font-size: 13px; font-weight: 700; }
.field input, .field select, .field textarea { border: 1px solid var(--line); background: var(--card); padding: 10px 12px; width: 100%; min-width: 0; }
.field textarea { min-height: 120px; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--ink); outline: none; }
.form { display: grid; gap: 14px; }
.form .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 560px) { .form .two { grid-template-columns: 1fr; } }
.check { display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; }
.empty { text-align: center; color: var(--muted); padding: 48px 12px; }

/* 강좌 카드 */
.cgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 18px; }
.ccard { background: var(--card); border: 1px solid var(--line); cursor: pointer; text-align: left; padding: 0; display: flex; flex-direction: column; min-width: 0; transition: border-color .15s; }
.ccard:hover { border-color: var(--ink); }
.ccard .th { aspect-ratio: 16/9; width: 100%; max-width: 100%; background: #333 center/cover no-repeat; position: relative; }
.ccard .tag { position: absolute; left: 10px; top: 10px; background: rgba(0,0,0,.72); color: #fff; font-size: 12px; padding: 3px 8px; font-weight: 700; }
.ccard .tag.mine { left: auto; right: 10px; background: var(--accent); color: var(--accent-ink); }
.ccard .bd { padding: 14px 16px 16px; display: grid; gap: 4px; }
.ccard .t { font-weight: 700; font-size: 15px; line-height: 1.45; }
.ccard .s { font-size: 13px; color: var(--muted); }
.pbar { height: 6px; background: #ececea; overflow: hidden; }
.pbar i { display: block; height: 100%; background: var(--accent); }

/* 강좌 보기 */
.course-top { display: grid; grid-template-columns: 1.6fr 1fr; gap: 24px; align-items: start; }
@media (max-width: 860px) { .course-top { grid-template-columns: 1fr; } }
.player { background: #000; aspect-ratio: 16/9; width: 100%; max-width: 100%; display: grid; place-items: center; color: #aaa; }
.player video { width: 100%; height: 100%; display: block; background: #000; }
.lessons { display: grid; gap: 0; border: 1px solid var(--line); background: var(--card); }
.lesson { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; padding: 12px 14px; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; cursor: pointer; }
.lesson:last-child { border-bottom: 0; }
.lesson.on { background: var(--tint); }
.lesson .no { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--muted); text-align: center; }
.lesson .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.badge { font-size: 12px; padding: 2px 8px; border: 1px solid var(--line); white-space: nowrap; font-weight: 700; }
.badge.done { border-color: var(--ok); color: var(--ok); }
.badge.ing { border-color: var(--gold); color: var(--gold); }
.badge.wait { color: var(--muted); }
.lock { background: var(--card); border: 1px solid var(--line); padding: 44px 24px; text-align: center; }
.lock h3 { font-family: var(--display); font-weight: 600; margin: 0 0 8px; }

/* 게시판 */
.board { width: 100%; border-collapse: collapse; background: var(--card); border-top: 2px solid var(--ink); }
.board th, .board td { padding: 13px 10px; border-bottom: 1px solid var(--line); text-align: left; font-size: 14px; }
.board th { font-size: 13px; color: var(--muted); font-weight: 700; }
.board td.num, .board th.num { width: 64px; text-align: center; font-variant-numeric: tabular-nums; color: var(--muted); }
.board td.date { width: 110px; font-variant-numeric: tabular-nums; color: var(--muted); }
.board td.st { width: 90px; }
.board tr.click { cursor: pointer; }
.board tr.click:hover td { background: var(--soft); }
.tbl { overflow-x: auto; }
.post h2 { font-family: var(--display); font-weight: 600; font-size: 24px; margin: 0 0 6px; }
.post .meta { color: var(--muted); font-size: 13px; padding-bottom: 14px; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
.post .body { white-space: pre-wrap; min-height: 80px; }
.answer { margin-top: 24px; background: var(--soft); border-left: 3px solid var(--accent); padding: 18px 20px; white-space: pre-wrap; }
.answer b { display: block; margin-bottom: 6px; white-space: normal; }

/* 푸터 */
.foot { background: var(--night); color: #b9b9b5; font-size: 13px; }
.foot .wrap { padding-block: 34px 40px; display: grid; gap: 6px; }
.foot b { color: #fff; font-family: var(--display); font-size: 17px; }
.demo-flag { color: var(--accent); }

/* ── 관리자 ── */
.admin { display: grid; grid-template-columns: 210px 1fr; min-height: calc(100vh - 120px); }
.side { background: var(--night); color: #fff; padding: 22px 12px; display: grid; align-content: start; gap: 2px; }
.side .who { font-size: 12px; color: #9a9b97; padding: 0 10px 14px; }
.side button { background: none; border: 0; color: #d7d7d3; text-align: left; padding: 11px 12px; cursor: pointer; font-weight: 500; display: flex; justify-content: space-between; }
.side button.on { background: #2a2d30; color: #fff; box-shadow: inset 3px 0 0 var(--accent); }
.side button:hover { color: #fff; }
.side .cnt { background: var(--accent); color: var(--accent-ink); font-size: 11px; font-weight: 700; padding: 0 7px; border-radius: 10px; }
.amain { padding: 30px max(16px, env(safe-area-inset-right, 0px)) 80px 30px; min-width: 0; }
.amain h1 { font-family: var(--display); font-weight: 600; font-size: 26px; margin: 0 0 4px; }
.ahead { display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
.toolbar select, .toolbar input { border: 1px solid var(--line); background: var(--card); padding: 8px 10px; min-width: 0; }
@media (max-width: 860px) {
  .admin { grid-template-columns: 1fr; }
  .side { grid-auto-flow: column; grid-auto-columns: max-content; overflow-x: auto; padding: 8px max(16px, env(safe-area-inset-left, 0px)); }
  .side .who { display: none; }
  .side button.on { box-shadow: inset 0 -3px 0 var(--accent); }
  .amain { padding-left: max(16px, env(safe-area-inset-left, 0px)); }
}
.alist { display: grid; gap: 8px; }
.arow { display: grid; grid-template-columns: 112px 1fr auto; gap: 14px; align-items: center; background: var(--card); border: 1px solid var(--line); padding: 10px; }
.arow .th { aspect-ratio: 16/9; width: 100%; background: #333 center/cover; }
.arow .t { font-weight: 700; min-width: 0; }
.arow .s { font-size: 13px; color: var(--muted); }
.arow .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
@media (max-width: 600px) { .arow { grid-template-columns: 80px 1fr; } .arow .acts { grid-column: 1 / -1; justify-content: flex-start; } }
.lrow { display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items: center; background: var(--card); border: 1px solid var(--line); padding: 10px 12px; }
.lrow .no { font-weight: 700; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; }
.lrow .nm { min-width: 0; }
.lrow .nm div:first-child { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lrow .acts { display: flex; gap: 4px; }
.ib { min-width: 34px; height: 32px; border: 1px solid var(--line); background: var(--card); cursor: pointer; font-size: 13px; padding: 0 9px; }
.ib:hover:not(:disabled) { border-color: var(--ink); }
.ib:disabled { opacity: .3; cursor: default; }
.ib.del:hover:not(:disabled) { border-color: var(--warn); color: var(--warn); }
.drop { border: 1.5px dashed #c7c6bf; background: var(--card); padding: 22px; text-align: center; cursor: pointer; color: var(--muted); }
.drop.over, .drop:hover { border-color: var(--ink); color: var(--ink); }
.drop b { color: var(--ink); }
.upq { display: grid; gap: 6px; margin-top: 10px; }
.upi { background: var(--card); border: 1px solid var(--line); padding: 8px 12px; font-size: 13px; display: grid; gap: 6px; }
.upi .pbar { height: 5px; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 22px; }
.stat { background: var(--card); border: 1px solid var(--line); padding: 14px 16px; }
.stat b { display: block; font-size: 24px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); }
@media (max-width: 700px) { .stats { grid-template-columns: repeat(2, 1fr); } }
.enroll-group { margin-top: 10px; }
.enroll-group h4 { margin: 12px 0 6px; font-size: 13px; color: var(--muted); }
.enroll-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--line); background: var(--card); margin-bottom: 4px; cursor: pointer; }
.enroll-item.on { border-color: var(--ink); background: var(--tint); }
.enroll-item .prog { margin-left: auto; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* 모달 · 알림 */
.modal-bg { position: fixed; inset: 0; background: rgba(15,16,17,.55); z-index: 100; display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.modal { background: var(--card); width: min(620px, 100%); max-height: 90vh; overflow: auto; padding: 26px; }
.modal h3 { font-family: var(--display); font-weight: 600; font-size: 21px; margin: 0 0 18px; }
.modal .acts { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--night); color: #fff; padding: 11px 20px; z-index: 200; font-weight: 500; }
.demo-box { background: var(--tint); border: 1px solid #a9dcc3; padding: 14px 16px; font-size: 13px; margin-top: 18px; }
.demo-box b { display: block; margin-bottom: 4px; }
.demo-box button { background: none; border: 0; padding: 0; text-decoration: underline; cursor: pointer; font-weight: 700; }
.login-box { max-width: 420px; margin: 0 auto; }
.thumb-prev { aspect-ratio: 16/9; width: 200px; max-width: 100%; background: #333 center/cover; border: 1px solid var(--line); }
.dswitch { position: fixed; left: max(12px, env(safe-area-inset-left, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 90; display: flex; align-items: center; gap: 2px; background: #111; color: #aaa; font-size: 12px; padding: 4px 4px 4px 10px; border-radius: 999px; box-shadow: 0 4px 14px rgba(0,0,0,.25); }
.dswitch span { margin-right: 4px; }
.dswitch a { color: #fff; text-decoration: none; width: 26px; height: 26px; display: grid; place-items: center; border-radius: 50%; font-weight: 700; }
.dswitch a.on { background: #fff; color: #111; }
/* 시안 B 다듬기: 둥근 모서리 · 알약 버튼 */
.btn { border-radius: 999px; }
.panel, .ccard, .lessons, .lock, .stat, .arow, .lrow, .upi, .drop, .enroll-item, .modal, .demo-box, .chip, .field input, .field select, .field textarea, .toolbar select, .toolbar input { border-radius: 14px; }

const thumbCache = new Map();
function autoThumb(course) {
  const k = course.id + course.title + course.color;
  if (thumbCache.has(k)) return thumbCache.get(k);
  const cv = document.createElement('canvas'); cv.width = 640; cv.height = 360;
  const x = cv.getContext('2d');
  x.fillStyle = course.color || '#2d3a34'; x.fillRect(0, 0, 640, 360);
  const g = x.createRadialGradient(170, 90, 10, 170, 90, 420); g.addColorStop(0, 'rgba(255,255,255,.12)'); g.addColorStop(1, 'rgba(0,0,0,.25)');
  x.fillStyle = g; x.fillRect(0, 0, 640, 360);
  x.fillStyle = 'rgba(255,255,255,.07)'; x.font = 'italic 120px "IBM Plex Sans KR", sans-serif'; x.fillText('∑ x²', 330, 330);
  x.fillStyle = '#6fd3a8'; x.fillRect(40, 60, 46, 5);
  x.fillStyle = '#ffffff'; x.font = '700 34px "IBM Plex Sans KR", sans-serif';
  const words = course.title.split(' '); let line = '', y = 120;
  for (const w of words) { const t = line ? line + ' ' + w : w; if (x.measureText(t).width > 540) { x.fillText(line, 40, y); line = w; y += 46; } else line = t; }
  x.fillText(line, 40, y);
  x.font = '500 22px "Noto Sans KR", sans-serif'; x.fillStyle = 'rgba(255,255,255,.75)'; x.fillText(course.teacher || '', 40, 318);
  const url = cv.toDataURL('image/jpeg', 0.82); thumbCache.set(k, url); return url;
}
const thumbOf = (c) => c.thumb || autoThumb(c);

let heroDefault = null;
function heroBg() {
  if (DB.settings.heroImage) return DB.settings.heroImage;
  if (heroDefault) return heroDefault;
  // 기본 대표 이미지: 판서가 남은 칠판
  const cv = document.createElement('canvas'); cv.width = 1600; cv.height = 900;
  const x = cv.getContext('2d');
  x.fillStyle = '#26382f'; x.fillRect(0, 0, 1600, 900);
  for (let i = 0; i < 2600; i++) { x.fillStyle = `rgba(255,255,255,${Math.random() * 0.035})`; x.fillRect(Math.random() * 1600, Math.random() * 900, Math.random() * 60, 1); }
  const f = ['f(x) = ax² + bx + c', 'lim  (1 + 1/n)ⁿ = e', '∫₀¹ x² dx = 1/3', 'sin²θ + cos²θ = 1', 'aₙ = a₁ + (n − 1)d', 'log₂ 8 = 3', 'x = (−b ± √(b² − 4ac)) / 2a', '∑ k = n(n + 1)/2', '(a + b)² = a² + 2ab + b²', 'y = 2x − 3'];
  x.textBaseline = 'middle';
  f.forEach((t, i) => {
    x.save(); x.translate(80 + (i % 3) * 520 + Math.random() * 60, 90 + Math.floor(i / 3) * 210 + Math.random() * 40); x.rotate((Math.random() - 0.5) * 0.06);
    x.fillStyle = `rgba(255,255,255,${0.22 + Math.random() * 0.2})`; x.font = `italic ${38 + Math.random() * 18}px "IBM Plex Sans KR", sans-serif`; x.fillText(t, 0, 0); x.restore();
  });
  x.strokeStyle = 'rgba(255,255,255,.18)'; x.lineWidth = 2; x.beginPath(); x.moveTo(1150, 760); for (let t = 0; t <= 300; t += 5) x.lineTo(1150 + t, 760 - (t * t) / 260); x.stroke();
  heroDefault = cv.toDataURL('image/jpeg', 0.8); return heroDefault;
}
function readImage(file, maxW, maxH, q = 0.82) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => { const im = new Image(); im.onload = () => { const r = Math.min(1, maxW / im.width, maxH / im.height); const cv = document.createElement('canvas'); cv.width = Math.round(im.width * r); cv.height = Math.round(im.height * r); cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height); res(cv.toDataURL('image/jpeg', q)); }; im.onerror = rej; im.src = fr.result; };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}

    ${info}</div>
    <div class="section"><h2>강의 목차</h2>${c.lessons.length ? `<div class="lessons">${lessonRows}</div>` : '<div class="empty">아직 올라온 영상이 없습니다.</div>'}</div>
    ${isAdmin() ? `<p style="margin-top:20px"><button class="btn line" data-go="admin" data-tab="courseEdit" data-id="${c.id}">관리자 화면에서 이 강좌 편집</button></p>` : ''}
  </div>`;
}
let playerUrl = null;
function stopPlayer() { const v = $('#player video'); if (v) v.pause(); if (playerUrl) { URL.revokeObjectURL(playerUrl); playerUrl = null; } }
async function mountPlayer() {
  const c = courseById(ROUTE.p.id); const box = $('#player');
  if (!c || !box || !currentLesson) return;
  const l = c.lessons.find((x) => x.id === currentLesson); if (!l) return;
  $('#nowTitle').textContent = l.title;
  let src = null;
  if (l.src.type === 'file') src = MEDIA_BASE + l.src.path;
  else if (l.src.type === 'idb') { try { const blob = await IDB.get(l.src.key); if (blob) { playerUrl = URL.createObjectURL(blob); src = playerUrl; } } catch (e) {} }
  if (!src) { box.textContent = '이 영상 파일을 찾을 수 없습니다. (시연판은 영상을 올린 브라우저에서만 재생됩니다)'; return; }
  box.innerHTML = `<video controls playsinline preload="metadata" src="${esc(src)}"></video>`;
  const v = box.querySelector('video'); const st = me();
  if (st) {
    let last = 0;
    v.addEventListener('timeupdate', () => {
      if (!v.duration) return;
      const p = Math.min(100, (v.currentTime / v.duration) * 100);
      const prev = lessonPct(st.id, l.id);
      if (p > prev && (p - last > 3 || p >= 90)) {
        last = p; DB.progress[st.id] = DB.progress[st.id] || {}; DB.progress[st.id][l.id] = p >= 95 ? 100 : p; save();
        const row = document.querySelector(`.lesson[data-id="${l.id}"] .badge`);
        if (row) { const q = lessonPct(st.id, l.id); row.className = 'badge ' + (q >= 90 ? 'done' : 'ing'); row.textContent = q >= 90 ? '완료' : q + '%'; }
      }
    });
    v.addEventListener('ended', () => { DB.progress[st.id] = DB.progress[st.id] || {}; DB.progress[st.id][l.id] = 100; save(); });
  }
}

async function addVideos(files) {
  const c = courseById(AT.courseId); if (!c) return;
  for (const f of files) {
    if (!f.type.startsWith('video/') && !/\.(mp4|mov|m4v|webm|mkv|avi)$/i.test(f.name)) { toast('영상 파일만 올릴 수 있어요'); continue; }
    const u = { id: uid(), courseId: c.id, name: f.name, size: f.size, pct: 0, done: false }; uploads.push(u);
    const refresh = () => { const q = $('#upq'); if (q) q.innerHTML = uploadsHtml(); };
    refresh();
    // 실제 납품판: 영상 서비스로 직접 전송 / 시연판: 이 브라우저 저장소에 보관
    const key = 'v_' + uid();
    const saving = IDB.put(key, f).then(() => true).catch(() => false);
    for (let p = 0; p <= 100; p += 10) { u.pct = p; refresh(); await new Promise((r) => setTimeout(r, 90)); }
    const ok = await saving;
    if (!ok) { u.pct = 0; toast('이 브라우저에서는 영상을 저장할 수 없어요'); uploads.splice(uploads.indexOf(u), 1); refresh(); continue; }
    c.lessons.push({ id: uid(), title: f.name.replace(/\.[^.]+$/, '').replace(/_+/g, ' ').trim(), src: { type: 'idb', key }, size: f.size });
    save(); u.done = true; refresh();
  }
  render();
  setTimeout(() => { for (let i = uploads.length - 1; i >= 0; i--) if (uploads[i].done) uploads.splice(i, 1); const q = $('#upq'); if (q) q.innerHTML = uploadsHtml(); }, 2500);
}

    const err = $('#qErr'); const bad = !author ? '작성자 이름을 입력해주세요.' : !title ? '제목을 입력해주세요.' : !body ? '내용을 입력해주세요.' : (secret && !st && pw.length < 4) ? '비밀글은 비밀번호 4자리 이상을 정해주세요.' : '';
    if (bad) { err.textContent = bad; err.hidden = false; return; }
    const q = { id: uid(), title, body, author, studentId: st ? st.id : null, secret, guestPw: pw || null, createdAt: today(), answer: null };
    DB.qna.push(q); save(); unlockedQna.add(q.id); toast('질문을 등록했어요'); go('qnaPost', { id: q.id });
  }
  if (f.id === 'consultForm') {
    const name = $('#cName').value.trim(), phone = $('#cPhone').value.trim(); const err = $('#cErr');
    if (!name || !phone) { err.textContent = '이름과 연락처를 입력해주세요.'; err.hidden = false; return; }
    DB.consults.push({ id: uid(), name, phone, grade: $('#cGrade').value, message: $('#cMsg').value.trim(), createdAt: today(), done: false }); save();
    $('#app main').innerHTML = band('CONSULT', '상담신청') + `<div class="wrap page"><div class="panel" style="max-width:640px"><h2 style="font-family:var(--display);margin:0 0 8px">상담신청이 접수되었습니다</h2><p class="muted" style="margin:0">학원에서 확인 후 ${esc(phone)} 번호로 연락드리겠습니다.</p><p style="margin-top:16px"><button class="btn line" data-go="home">첫 화면으로</button></p></div></div>`;
  }
});

// 시작
DB = load() || seed(); save(); loadSession();
if (SESSION && SESSION.role === 'student' && !me()) SESSION = null;
render();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { thumbCache.clear(); heroDefault = null; render(); });
</script>

</body>
</html>
